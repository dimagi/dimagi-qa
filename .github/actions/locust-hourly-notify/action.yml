name: Notify hourly load test result
description: >-
  Upload one hourly BHA load test scenario's report and log, and send its result
  email and Slack message.
inputs:
  title:
    description: Scenario name used in the email, e.g. "Admit Client".
    required: true
  workflow-name:
    description: Name shown in the Slack message.
    required: true
  artifact-name:
    description: Name of the uploaded report artifact.
    required: true
  report-dir:
    description: Directory holding the scenario's hour_*.html report and locust.log.
    required: true
  status:
    description: Job status to report (success, failure or cancelled).
    required: true
  environment:
    description: Environment the load test ran against.
    required: true
  mail-username:
    required: true
  mail-password:
    required: true
  slack-webhook-url:
    required: true
runs:
  using: composite
  steps:
    - name: Archive test results
      id: artifact-upload-step
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.report-dir }}/hour_*.html
          ${{ inputs.report-dir }}/locust.log
        retention-days: 2

    - name: Fetch artifact ID
      shell: bash
      run: echo 'Artifact ID is ${{ steps.artifact-upload-step.outputs.artifact-id }}'


    - name: Set email vars
      if: ${{ always() }}
      id: configure_email
      uses: actions/github-script@v6
      env:
          JOB_STATUS: ${{ inputs.status }}
          CC_ENV: ${{ inputs.environment }}
      with:
        script: |
          const { promises: fs } = require('fs')

          const {JOB_STATUS, NOW, CC_ENV, GITHUB_HEAD_REF} = process.env
          const prefix = `[${CC_ENV}] ${{ inputs.title }} Locust Tests - ${JOB_STATUS.toUpperCase()} - Run #${context.runNumber}`
          const suffix = `at ${NOW}`

          let subject = `${prefix} on "deploy_success" ${suffix}`
          if (context.eventName !== "repository_dispatch") {
            subject = `${prefix} on branch "${GITHUB_HEAD_REF}" ${suffix}`
          }

          let bodyFile = './common_utilities/mail_templates/email_pass.md'
          if (JOB_STATUS !== 'success') {
            bodyFile = './common_utilities/mail_templates/email_fail.md'
          }

          let actionRunLink = context.payload.repository.html_url + `/actions/runs/${context.runId}`
          let testSuite = 'BHA ${{ inputs.title }} Hourly Load Tests for ${{ env.MT_HOUR }} hrs'
          let bodyContent = await fs.readFile(bodyFile, 'utf8')
          bodyContent = bodyContent.replace(/{{actionRunLink}}/g, actionRunLink)
              .replace(/{{runNumber}}/g, context.runNumber)
              .replace(/{{environment}}/g, CC_ENV)
              .replace(/{{testSuite}}/g, testSuite)

          let receivers = 'qa-automation@dimagi.com'
          if (context.eventName !== "pull_request" || context.eventName !== "push") {
            receivers = 'kbordoloi@dimagi.com'
          }

          return {
            "subject": subject,
            "body": bodyContent,
            "reference": Math.random().toString(36).substr(2),  // used to prevent threading of similar emails
            "receivers": receivers
          }

    - name: Send Result Email
      if: ${{ always() }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ inputs.mail-username }}
        password: ${{ inputs.mail-password }}
        subject: ${{ fromJSON(steps.configure_email.outputs.result).subject }}
        to: ${{ fromJSON(steps.configure_email.outputs.result).receivers }}
        from: <${{ inputs.mail-username }}>
        html_body: ${{ fromJSON(steps.configure_email.outputs.result).body }}
        convert_markdown: true
        attachments: ${{ github.workspace }}/${{ inputs.report-dir }}/hour_*.html
        in_reply_to: ${{ fromJSON(steps.configure_email.outputs.result).reference }}

    - name: Set slack vars
      if: ${{ inputs.status != 'cancelled' }}
      id: configure_slack
      uses: actions/github-script@v6
      env:
          JOB_STATUS: ${{ inputs.status }}
          CC_ENV: ${{ inputs.environment }}
          CC_EVENT: ${{ github.event_name }}
      with:
        result-encoding: string
        script: |
          const {CC_ENV, JOB_STATUS, CC_EVENT} = process.env
          let SLACK_WEBHOOK_URL = '${{ inputs.slack-webhook-url }}'
          if (CC_ENV == 'production') {
            SLACK_WEBHOOK_URL = '${{ inputs.slack-webhook-url }}'
            console.log("Slack notification")
          } else {
            SLACK_WEBHOOK_URL = ' '
            console.log("No notification sent")
          }

          return SLACK_WEBHOOK_URL

    - name: Post to Slack channel on Failure
      id: slack_fail
      uses: slackapi/slack-github-action@v1.23.0
      if: ${{ steps.configure_slack.outputs.result != ' ' && inputs.status == 'failure' }}
      with:
        payload: |
          {
          	"attachments": [
          		{
          			"color": "#FF0000",
          			"blocks": [
          				{
          					"type": "section",
          					"text": {
          						"type": "mrkdwn",
          						"text": " Hola :alphabet-yellow-q::alphabet-yellow-a: 👋 \n*${{ inputs.workflow-name }}* were just triggered for ${{ env.MT_HOUR }} hrs!\n"
          					}
          				},
          				{
          					"type": "context",
          					"elements": [
          						{
          							"type": "mrkdwn",
          							"text": "*Environment: *\n ${{ inputs.environment }}  \n"
          						},
          						{
          							"type": "mrkdwn",
          							"text": " "
          						},
          						{
          							"type": "mrkdwn",
          							"text": "*Status: *\n ${{ inputs.status }}  :x:"
          						}
          					]
          				},
          				{
          					"type": "section",
          					"text": {
          						"type": "mrkdwn",
          						"text": "Here's the corresponding report :arrow_right::arrow_right:"
          					},
          					"accessory": {
          						"type": "button",
          						"text": {
          							"type": "plain_text",
          							"text": "Click to Downlaod",
          							"emoji": true
          						},
          						"value": "click_me_123",
                                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.artifact-upload-step.outputs.artifact-id }}",
          						"action_id": "button-action",
          						"style": "danger"
          					}
          				}
          			]
          		}
          	]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ steps.configure_slack.outputs.result }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    - name: Post to Slack channel on Success
      id: slack_pass
      uses: slackapi/slack-github-action@v1.23.0
      if: ${{ steps.configure_slack.outputs.result != ' ' && inputs.status == 'success' }}
      with:
        payload: |
          {
          	"attachments": [
          		{
          			"color": "#36a64f",
          			"blocks": [
          				{
          					"type": "section",
          					"text": {
          						"type": "mrkdwn",
          						"text": " Hola :alphabet-yellow-q::alphabet-yellow-a: 👋 \n*${{ inputs.workflow-name }}* were just triggered for ${{ env.MT_HOUR }} hrs!\n"
          					}
          				},
          				{
          					"type": "context",
          					"elements": [
          						{
          							"type": "mrkdwn",
          							"text": "*Environment: *\n ${{ inputs.environment }}  \n"
          						},
          						{
          							"type": "mrkdwn",
          							"text": " "
          						},
          						{
          							"type": "mrkdwn",
          							"text": "*Status: *\n ${{ inputs.status }}  :white_check_mark:"
          						}
          					]
          				},
          				{
          					"type": "section",
          					"text": {
          						"type": "mrkdwn",
          						"text": "Here's the corresponding report :arrow_right::arrow_right:"
          					},
          					"accessory": {
          						"type": "button",
          						"text": {
          							"type": "plain_text",
          							"text": "Click to Download",
          							"emoji": true
          						},
          						"value": "click_me_123",
          						"url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.artifact-upload-step.outputs.artifact-id }}",
          						"action_id": "button-action",
          						"style": "primary"
          					}
          				}
          			]
          		}
          	]
          }

      env:
        SLACK_WEBHOOK_URL: ${{ steps.configure_slack.outputs.result }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
