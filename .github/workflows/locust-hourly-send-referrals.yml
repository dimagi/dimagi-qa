# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Hourly Send Referrals Load test

on:
  schedule:
    - cron: '4 6-23 * * 1-5'
    - cron: '4 0-5 * * 2-6'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'production'
        type: choice
        options:
          - production
jobs:
  set_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix-manual.outputs.matrix || steps.set-matrix-default.outputs.matrix }}
    steps:
      - id: set-matrix-manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "::set-output name=matrix::{\"environment\": [\"${{ inputs.environment }}\"]}"
      - id: set-matrix-default
        if: ${{ !contains(github.event_name , 'dispatch') }}
        run: |
          echo "::set-output name=matrix::{\"environment\": [\"production\"]}"

  build:
    needs: set_matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set_matrix.outputs.matrix) }}
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.environment }}
      cancel-in-progress: true
    name: LoadTest on '${{ matrix.environment }}'
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    env:
      SCENARIO_TITLE: Send Referrals
      ARTIFACT_PREFIX: hourly-locust-reports-send-referrals
      LOCUSTFILE: LocustScripts/update-scripts/commcarehq-hourly-send_refferals-mw-login.py
      USER_DETAILS: LocustScripts/update-scripts/project-config/co-carecoordination-perf/mobile_worker_credentials_send_refferals_hourly.json
      APP_CONFIG: LocustScripts/update-scripts/project-config/co-carecoordination-perf/app_config_send_referrals.json
      HOST: https://www.commcarehq.org
      APP_ID: 5abfe7d62fd54e7cb7e6038f8a68e0ea
      BUILD_ID: b9a1ef9ff5ba4b61957f1e0524f0dd03
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.13
        uses: actions/setup-python@v2
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r LocustScripts/requirements.txt

      - name: Hourly ${{ env.SCENARIO_TITLE }} Load test with Locust
        continue-on-error: true
        env:
          DIMAGIQA_ENV: ${{ matrix.environment }}  #${{ secrets.DIMAGIQA_URL }}
          DIMAGIQA_LOCUST_PASSWORD: ${{ secrets.DIMAGIQA_LOCUST_PASSWORD }}
          DIMAGIQA_MAIL_USERNAME: ${{ secrets.DIMAGIQA_MAIL_USERNAME }}
          DIMAGIQA_MAIL_PASSWORD: ${{ secrets.DIMAGIQA_MAIL_PASSWORD }}
        run: |
          echo "client_payload: ${{ toJson(github.event.client_payload) }}"
          echo "matrix environment: ${{ matrix.environment }}"
          echo "NOW=$(date +'%m-%d %H:%M')" >> $GITHUB_ENV
          echo ${{env.NOW}}
          python LocustScripts/update-scripts/run_24hr_locust_schedule.py \
            --locust-file "$LOCUSTFILE" \
            --user-details "$USER_DETAILS" \
            --app-config "$APP_CONFIG" \
            --host "$HOST" \
            --domain co-carecoordination-perf \
            --app-id "$APP_ID" \
            --build-id "$BUILD_ID"

      - name: Echo current Mountain Time hour
        run: |
          python -c "
          import pytz
          from datetime import datetime
          mt = pytz.timezone('US/Mountain')
          now = datetime.now(mt)
          print('Current Mountain Time hour:', now.strftime('%H'))
          "

      - name: Set MT hour to env
        run: |
          MT_HOUR=$(python -c "import pytz; from datetime import datetime; print(datetime.now(pytz.timezone('US/Mountain')).strftime('%H'))")
          echo "MT_HOUR=$MT_HOUR" >> $GITHUB_ENV

      - name: Report ${{ env.SCENARIO_TITLE }} results
        if: ${{ always() }}
        uses: ./.github/actions/locust-hourly-notify
        with:
          title: ${{ env.SCENARIO_TITLE }}
          workflow-name: ${{ github.workflow }}
          artifact-name: ${{ env.ARTIFACT_PREFIX }}-${{ env.MT_HOUR }}
          report-dir: .
          status: ${{ job.status }}
          environment: ${{ matrix.environment }}
          mail-username: ${{ secrets.DIMAGIQA_MAIL_USERNAME }}
          mail-password: ${{ secrets.DIMAGIQA_MAIL_PASSWORD }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_BHA }}
